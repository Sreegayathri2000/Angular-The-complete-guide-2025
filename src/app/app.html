<app-header />

<main>
  <ul id="users">
    @for(user of users;track user.id){
    <li>
      <app-user [isUserSelected]="userId===user.id" (userId)="onSelectUser($event)" [user]="user" />
    </li>

    }
  </ul>
  @if(selectedUser) {
  <app-tasks [userId]="selectedUser.id" [name]="selectedUser.name"></app-tasks>

  }@else {
  <p id="fallback">Select a User to see their results!!!</p>
  }
</main>
