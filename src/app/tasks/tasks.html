@if(isTaskAdded)
{
    <app-new-task (cancel)="onCancel()" [userId]="userId" ></app-new-task>
}
<section id="tasks">
  <header>
    <h2>{{ name }}'s Tasks</h2>
    <menu>
      <button (click)="addTask()" >Add Task</button>
    </menu>
  </header>

  <ul>
    @for(task of selectedUser;track task.userId){
    <li>
      <app-task [task]="task"/>
    </li>

    }
  </ul>
</section>
